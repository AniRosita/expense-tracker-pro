<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile - Expense Tracker</title>
    <link rel="icon" type="image/png" href="assets/profile.png">


    <link rel="stylesheet" href="css/profile.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>


<body>


<div class="profile-container">


    <div class="profile-card">

        <div class="profile-logo">
             <div id="profileLetter"
    onclick="openImagePopup()">
        U
    </div>


    <img id="profileImg"
    onclick="openImagePopup()"
    style="cursor:pointer; display:none;">

    <input 
    type="file"
    id="profileUpload"
    accept="image/*"
    style="display:none;">

</div>

</div>

        <h2>My Profile</h2>


        <div class="input-group">

            <label>Name</label>
            <input type="text" id="profileName" placeholder="Enter Name">

        </div>


        <div class="input-group">

            <label>Email</label>
            <input type="email" id="profileEmail" readonly>

        </div>



        <div class="input-group">

            <label>Country</label>
            <input type="text" id="profileCountry" placeholder="Enter Country">

        </div>



        <div class="input-group">

            <label>Currency</label>

            <select id="profileCurrency">

                <option value="INR">₹ INR - Indian Rupee</option>
                <option value="USD">$ USD - Dollar</option>
                <option value="EUR">€ EUR - Euro</option>
                <option value="GBP">£ GBP - Pound</option>

            </select>

        </div>
        <div class="input-group">

    <label>Minimum Balance Alert</label>

    <input
    type="number"
    id="minimumBalance"
    placeholder="Enter Minimum Balance">

</div>



        <div class="stats">


            <div>
                <h3 id="totalIncome">₹0</h3>
                <p>Income</p>
            </div>


            <div>
                <h3 id="totalExpense">₹0</h3>
                <p>Expense</p>
            </div>


            <div>
                <h3 id="totalBalance">₹0</h3>
                <p>Balance</p>
            </div>


        </div>



        <button id="saveProfile">
            Save Profile
        </button>
        <button class="back-btn" onclick="goDashboard()">
    ← Back Dashboard
</button>


        <div id="imageOptions" class="image-popup">

    <div class="image-box">

        <h3>Profile Photo</h3>

        <button onclick="viewProfileImage()">
            View Photo
        </button>

        <button onclick="changeProfileImage()">
            Change Photo
        </button>

        <button onclick="removeProfileImage()">
            Remove Photo
        </button>

        <button onclick="closeImagePopup()">
            Cancel
        </button>

    </div>

</div>


    </div>


</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/currency.js"></script>
<script src="js/profile.js"></script>


</body>

</html>
