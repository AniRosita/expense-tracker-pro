<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Profile - Expense Tracker</title>

    <link
        rel="icon"
        type="image/png"
        href="assets/profile.png"
    >

    <!-- ==================================================
         THEME PRELOAD
         ================================================== -->

    <script>
        (function () {

            const theme =
                localStorage.getItem("theme");

            if (theme === "light") {

                document.documentElement
                    .classList.add("light-mode");
            }

        })();
    </script>

    <!-- ==================================================
         CSS
         ================================================== -->

    <link
        rel="stylesheet"
        href="css/profile.css"
    >

    <!-- ==================================================
         GOOGLE FONT
         ================================================== -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>

<div class="profile-container">

    <div class="profile-card">

        <!-- ==================================================
             PROFILE PHOTO
             ================================================== -->

        <div class="profile-logo">

            <!-- NAME FIRST LETTER -->
            <div
                id="profileLetter"
                onclick="openImagePopup()"
                style="cursor:pointer;"
            >
                U
            </div>


            <!-- PROFILE IMAGE -->

            <img
                id="profileImg"
                alt="Profile Image"
                onclick="openImagePopup()"
                style="
                    cursor:pointer;
                    display:none;
                "
            >


            <!-- HIDDEN FILE INPUT -->

            <input
                type="file"
                id="profileUpload"
                accept="image/*"
                style="display:none;"
            >

        </div>


        <!-- ==================================================
             TITLE
             ================================================== -->

        <h2>My Profile</h2>


        <!-- ==================================================
             NAME
             ================================================== -->

        <div class="input-group">

            <label for="profileName">
                Name
            </label>

            <input
                type="text"
                id="profileName"
                placeholder="Enter Name"
                autocomplete="name"
            >

        </div>


        <!-- ==================================================
             EMAIL
             ================================================== -->

        <div class="input-group">

            <label for="profileEmail">
                Email
            </label>

            <input
                type="email"
                id="profileEmail"
                readonly
            >

        </div>


        <!-- ==================================================
             COUNTRY
             ================================================== -->

        <div class="input-group">

            <label for="profileCountry">
                Country
            </label>

            <input
                type="text"
                id="profileCountry"
                placeholder="Enter Country"
            >

        </div>


        <!-- ==================================================
             CURRENCY
             ================================================== -->

        <div class="input-group">

            <label for="profileCurrency">
                Currency
            </label>

            <select id="profileCurrency">

                <option value="INR">
                    ₹ INR - Indian Rupee
                </option>

                <option value="USD">
                    $ USD - Dollar
                </option>

                <option value="EUR">
                    € EUR - Euro
                </option>

                <option value="GBP">
                    £ GBP - Pound
                </option>

            </select>

        </div>


        <!-- ==================================================
             MINIMUM BALANCE
             ================================================== -->

        <div class="input-group">

            <label for="minimumBalance">
                Minimum Balance Alert
            </label>

            <input
                type="number"
                id="minimumBalance"
                placeholder="Enter Minimum Balance"
                min="0"
            >

        </div>


        
        <!-- ==================================================
             SAVE PROFILE
             ================================================== -->

        <button id="saveProfile">
            Save Profile
        </button>


        <!-- ==================================================
             BACK DASHBOARD
             ================================================== -->

        <button
            class="back-btn"
            onclick="goDashboard()"
        >
            ← Back Dashboard
        </button>


        <!-- ==================================================
             PROFILE IMAGE POPUP
             ================================================== -->

        <div
            id="imageOptions"
            class="image-popup"
        >

            <div class="image-box">

                <h3>
                    Profile Photo
                </h3>


                <button
                    type="button"
                    onclick="viewProfileImage()"
                >
                    View Photo
                </button>


                <button
                    type="button"
                    onclick="changeProfileImage()"
                >
                    Change Photo
                </button>


                <button
                    type="button"
                    onclick="removeProfileImage()"
                >
                    Remove Photo
                </button>


                <button
                    type="button"
                    onclick="closeImagePopup()"
                >
                    Cancel
                </button>

            </div>

        </div>

    </div>

</div>


<!-- ======================================================
     SWEETALERT
     ====================================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/sweetalert2@11"
></script>


<!-- ======================================================
     CURRENCY JS
     ====================================================== -->

<script src="js/currency.js"></script>


<!-- ======================================================
     THEME JS
     ====================================================== -->

<script src="js/theme.js"></script>


<!-- ======================================================
     PROFILE JS
     ====================================================== -->

<script src="js/profile.js"></script>


</body>

</html>
