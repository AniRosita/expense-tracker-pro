<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | Expense Tracker Pro</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: "Poppins", sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(99, 102, 241, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(139, 92, 246, 0.30),
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #1e1b4b
                );

            color: #ffffff;
        }

        body::before {

            content: "";

            position: fixed;

            width: 280px;
            height: 280px;

            top: -100px;
            right: -80px;

            background: rgba(99, 102, 241, 0.18);

            filter: blur(70px);

            border-radius: 50%;

            pointer-events: none;
        }

        body::after {

            content: "";

            position: fixed;

            width: 250px;
            height: 250px;

            bottom: -100px;
            left: -80px;

            background: rgba(168, 85, 247, 0.15);

            filter: blur(70px);

            border-radius: 50%;

            pointer-events: none;
        }

        .reset-card {

            position: relative;

            width: 100%;
            max-width: 430px;

            padding: 38px 34px;

            border-radius: 24px;

            background: rgba(15, 23, 42, 0.88);

            border: 1px solid rgba(255, 255, 255, 0.10);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);

            backdrop-filter: blur(18px);

            z-index: 2;
        }

        .logo {

            width: 64px;
            height: 64px;

            margin: 0 auto 18px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 18px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            box-shadow:
                0 10px 30px rgba(99, 102, 241, 0.35);

            font-size: 27px;
        }

        h1 {

            text-align: center;

            font-size: 25px;
            font-weight: 700;

            margin-bottom: 8px;

            color: #ffffff;
        }

        .subtitle {

            text-align: center;

            color: #94a3b8;

            font-size: 13px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        .email-box {

            display: flex;
            align-items: center;

            gap: 10px;

            padding: 12px 14px;

            margin-bottom: 22px;

            border-radius: 12px;

            background: rgba(99, 102, 241, 0.10);

            border: 1px solid rgba(99, 102, 241, 0.20);

            color: #c7d2fe;

            font-size: 13px;

            word-break: break-all;
        }

        .email-box i {
            color: #818cf8;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #e2e8f0;

            font-size: 13px;

            font-weight: 500;
        }

        .input-group {

            position: relative;

            margin-bottom: 18px;
        }

        .input-group > i:first-child {

            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #818cf8;

            font-size: 15px;

            pointer-events: none;
        }

        input {

            width: 100%;

            height: 48px;

            padding: 0 45px;

            border-radius: 12px;

            border: 1px solid rgba(148, 163, 184, 0.20);

            outline: none;

            background: rgba(30, 41, 59, 0.75);

            color: #ffffff;

            font-family: "Poppins", sans-serif;

            font-size: 14px;

            transition: 0.25s;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {

            border-color: #6366f1;

            background: rgba(30, 41, 59, 0.95);

            box-shadow:
                0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        #otp {

            text-align: center;

            letter-spacing: 8px;

            font-size: 20px;

            font-weight: 600;

            padding-left: 20px;
            padding-right: 20px;
        }

        .toggle-password {

            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #64748b;

            cursor: pointer;

            font-size: 14px;
        }

        .toggle-password:hover {
            color: #a5b4fc;
        }

        .reset-btn {

            width: 100%;

            height: 50px;

            margin-top: 5px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6
                );

            color: white;

            font-family: "Poppins", sans-serif;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(99, 102, 241, 0.25);

            transition: 0.25s;
        }

        .reset-btn:hover {

            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(99, 102, 241, 0.35);
        }

        .reset-btn:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;
        }

        #message {

            min-height: 22px;

            margin-top: 16px;

            text-align: center;

            font-size: 13px;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .back-login {

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 7px;

            margin-top: 23px;

            color: #a5b4fc;

            text-decoration: none;

            font-size: 13px;

            transition: 0.2s;
        }

        .back-login:hover {
            color: #ffffff;
        }

        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .reset-card {

                padding: 30px 22px;

                border-radius: 20px;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 12px;
            }
        }

    </style>

</head>


<body>


<div class="reset-card">


    <!-- LOGO -->

    <div class="logo">

        <i class="fas fa-wallet"></i>

    </div>


    <!-- TITLE -->

    <h1>
        Reset Password
    </h1>


    <p class="subtitle">

        Verify your OTP and create a new password

    </p>


    <!-- EMAIL -->

    <div class="email-box">

        <i class="fas fa-envelope"></i>

        <span id="emailDisplay">
            Loading email...
        </span>

    </div>


    <!-- FORM -->

    <form id="resetPasswordForm">


        <!-- OTP -->

        <label for="otp">
            OTP
        </label>

        <div class="input-group">

            <i class="fas fa-shield-halved"></i>

            <input
                type="text"
                id="otp"
                maxlength="6"
                inputmode="numeric"
                autocomplete="one-time-code"
                placeholder="Enter 6-digit OTP"
                required
            >

        </div>


        <!-- NEW PASSWORD -->

        <label for="newPassword">
            New Password
        </label>

        <div class="input-group">

            <i class="fas fa-lock"></i>

            <input
                type="password"
                id="newPassword"
                maxlength="6"
                inputmode="numeric"
                autocomplete="new-password"
                placeholder="Enter 6-digit password"
                required
            >

            <i
                class="fas fa-eye toggle-password"
                data-target="newPassword"
            ></i>

        </div>


        <!-- CONFIRM PASSWORD -->

        <label for="confirmPassword">
            Confirm Password
        </label>

        <div class="input-group">

            <i class="fas fa-lock"></i>

            <input
                type="password"
                id="confirmPassword"
                maxlength="6"
                inputmode="numeric"
                autocomplete="new-password"
                placeholder="Confirm password"
                required
            >

            <i
                class="fas fa-eye toggle-password"
                data-target="confirmPassword"
            ></i>

        </div>


        <!-- BUTTON -->

        <button
            type="submit"
            class="reset-btn"
            id="resetBtn"
        >

            <i class="fas fa-key"></i>

            Reset Password

        </button>


    </form>


    <!-- MESSAGE -->

    <div id="message"></div>


    <!-- BACK -->

    <a
        href="index.html"
        class="back-login"
    >

        <i class="fas fa-arrow-left"></i>

        Back to Login

    </a>


</div>



<script>


// =====================================================
// API BASE
// =====================================================

const API_BASE =
    "https://expense-tracker-pro-production-b745.up.railway.app";


// =====================================================
// GET RESET EMAIL
// =====================================================

const resetEmail =
    sessionStorage.getItem("resetEmail");


const emailDisplay =
    document.getElementById("emailDisplay");


if (!resetEmail) {

    emailDisplay.textContent =
        "No reset email found";

} else {

    emailDisplay.textContent =
        resetEmail;

}


// =====================================================
// ELEMENTS
// =====================================================

const form =
    document.getElementById(
        "resetPasswordForm"
    );


const otpInput =
    document.getElementById("otp");


const newPasswordInput =
    document.getElementById(
        "newPassword"
    );


const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );


const message =
    document.getElementById(
        "message"
    );


const resetBtn =
    document.getElementById(
        "resetBtn"
    );


// =====================================================
// NUMBER ONLY
// =====================================================

function onlyNumbers(input) {

    input.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .slice(0, 6);

        }
    );

}


onlyNumbers(otpInput);

onlyNumbers(newPasswordInput);

onlyNumbers(confirmPasswordInput);


// =====================================================
// PASSWORD SHOW / HIDE
// =====================================================

document
    .querySelectorAll(".toggle-password")
    .forEach(function (icon) {

        icon.addEventListener(
            "click",
            function () {

                const target =
                    document.getElementById(
                        this.dataset.target
                    );


                if (
                    target.type ===
                    "password"
                ) {

                    target.type =
                        "text";

                    this.classList.remove(
                        "fa-eye"
                    );

                    this.classList.add(
                        "fa-eye-slash"
                    );

                } else {

                    target.type =
                        "password";

                    this.classList.remove(
                        "fa-eye-slash"
                    );

                    this.classList.add(
                        "fa-eye"
                    );

                }

            }
        );

    });


// =====================================================
// MESSAGE HELPER
// =====================================================

function showMessage(
    text,
    type
) {

    message.className =
        type || "";

    message.textContent =
        text;

}


// =====================================================
// RESET PASSWORD
// =====================================================

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        // =============================================
        // EMAIL CHECK
        // =============================================

        if (!resetEmail) {

            showMessage(
                "Reset session expired. Please request a new OTP.",
                "error"
            );

            return;
        }


        // =============================================
        // GET VALUES
        // =============================================

        const otp =
            otpInput.value.trim();


        const newPassword =
            newPasswordInput.value.trim();


        const confirmPassword =
            confirmPasswordInput.value.trim();


        // =============================================
        // OTP VALIDATION
        // =============================================

        if (!/^\d{6}$/.test(otp)) {

            showMessage(
                "OTP must contain exactly 6 digits.",
                "error"
            );

            otpInput.focus();

            return;
        }


        // =============================================
        // PASSWORD VALIDATION
        // =============================================

        if (
            !/^\d{6}$/.test(
                newPassword
            )
        ) {

            showMessage(
                "Password must contain exactly 6 digits.",
                "error"
            );

            newPasswordInput.focus();

            return;
        }


        // =============================================
        // CONFIRM PASSWORD
        // =============================================

        if (
            newPassword !==
            confirmPassword
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            confirmPasswordInput.focus();

            return;
        }


        // =============================================
        // LOADING
        // =============================================

        resetBtn.disabled =
            true;


        resetBtn.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Verifying...';


        showMessage(
            "Verifying OTP...",
            ""
        );


        try {


            // =========================================
            // STEP 1
            // VERIFY OTP
            // =========================================

            console.log(
                "🔐 Verifying OTP..."
            );


            const verifyResponse =
                await fetch(
                    `${API_BASE}/api/verify-reset-otp`,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                email:
                                    resetEmail,

                                otp:
                                    otp

                            })

                    }
                );


            const verifyText =
                await verifyResponse.text();


            console.log(
                "Verify OTP Status:",
                verifyResponse.status
            );


            console.log(
                "Verify OTP Response:",
                verifyText
            );


            let verifyData;


            try {

                verifyData =
                    JSON.parse(
                        verifyText
                    );

            } catch {

                throw new Error(
                    "Server returned an invalid response."
                );

            }


            // =========================================
            // OTP FAILED
            // =========================================

            if (
                !verifyResponse.ok ||
                !verifyData.success
            ) {

                throw new Error(
                    verifyData.message ||
                    "Invalid or expired OTP."
                );

            }


            console.log(
                "✅ OTP verified"
            );


            // =========================================
            // STEP 2
            // RESET PASSWORD
            // =========================================

            resetBtn.innerHTML =
                '<i class="fas fa-spinner fa-spin"></i> Resetting...';


            showMessage(
                "OTP verified. Updating password...",
                ""
            );


            console.log(
                "🔑 Resetting password..."
            );


            const resetResponse =
                await fetch(
                    `${API_BASE}/api/reset-password`,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                email:
                                    resetEmail,

                                otp:
                                    otp,

                                newPassword:
                                    newPassword

                            })

                    }
                );


            const resetText =
                await resetResponse.text();


            console.log(
                "Reset Password Status:",
                resetResponse.status
            );


            console.log(
                "Reset Password Response:",
                resetText
            );


            let resetData;


            try {

                resetData =
                    JSON.parse(
                        resetText
                    );

            } catch {

                throw new Error(
                    "Server returned an invalid reset response."
                );

            }


            // =========================================
            // RESET FAILED
            // =========================================

            if (
                !resetResponse.ok ||
                !resetData.success
            ) {

                throw new Error(
                    resetData.message ||
                    "Password reset failed."
                );

            }


            // =========================================
            // SUCCESS
            // =========================================

            console.log(
                "✅ Password reset successfully"
            );


            showMessage(
                "Password reset successfully!",
                "success"
            );


            // Remove reset session

            sessionStorage.removeItem(
                "resetEmail"
            );


            // =========================================
            // SUCCESS MESSAGE
            // =========================================

            resetBtn.innerHTML =
                '<i class="fas fa-check"></i> Password Reset';


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1500
                    )
            );


            // =========================================
            // GO LOGIN
            // =========================================

            window.location.href =
                "index.html";


        } catch (error) {


            // =========================================
            // ERROR
            // =========================================

            console.error(
                "❌ Reset Password Error:",
                error
            );


            showMessage(
                error.message ||
                "Unable to reset password.",
                "error"
            );


        } finally {


            resetBtn.disabled =
                false;


            resetBtn.innerHTML =
                '<i class="fas fa-key"></i> Reset Password';

        }

    }
);

</script>


</body>

</html>
