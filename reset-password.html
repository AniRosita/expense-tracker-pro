<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Expense Tracker Pro</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Reset Password</h1>

    <p class="subtitle">
        Enter your OTP and create a new password
    </p>

    <form id="resetPasswordForm">

        <label for="otp">OTP</label>

        <input
            type="text"
            id="otp"
            maxlength="6"
            inputmode="numeric"
            placeholder="Enter 6-digit OTP"
            required
        >

        <label for="newPassword">New Password</label>

        <input
            type="password"
            id="newPassword"
            maxlength="6"
            inputmode="numeric"
            placeholder="Enter 6-digit password"
            required
        >

        <label for="confirmPassword">Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            maxlength="6"
            inputmode="numeric"
            placeholder="Confirm 6-digit password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <div id="message"></div>

    <a href="index.html" class="back">
        ← Back to Login
    </a>

</div>

<script>

const API_BASE =
    "https://expense-tracker-pro-production-b745.up.railway.app";

const form =
    document.getElementById("resetPasswordForm");

const message =
    document.getElementById("message");

form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const otp =
        document.getElementById("otp").value.trim();

    const newPassword =
        document.getElementById("newPassword").value.trim();

    const confirmPassword =
        document.getElementById("confirmPassword").value.trim();

    const email =
        sessionStorage.getItem("resetEmail");

    if (!email) {

        message.className = "error";

        message.textContent =
            "Reset session expired. Please request OTP again.";

        return;
    }

    if (!/^\d{6}$/.test(otp)) {

        message.className = "error";

        message.textContent =
            "OTP must contain exactly 6 digits.";

        return;
    }

    if (!/^\d{6}$/.test(newPassword)) {

        message.className = "error";

        message.textContent =
            "Password must contain exactly 6 digits.";

        return;
    }

    if (newPassword !== confirmPassword) {

        message.className = "error";

        message.textContent =
            "Passwords do not match.";

        return;
    }

    message.className = "";

    message.textContent =
        "Resetting password...";

    try {

        const response = await fetch(
            `${API_BASE}/api/reset-password`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    otp: otp,
                    newPassword: newPassword
                })
            }
        );

        const data =
            await response.json();

        console.log(
            "Reset Password Status:",
            response.status
        );

        console.log(
            "Reset Password Response:",
            data
        );

        if (!response.ok || !data.success) {

            throw new Error(
                data.message ||
                data.error ||
                "Password reset failed"
            );
        }

        message.className = "success";

        message.textContent =
            "Password reset successfully! Redirecting...";

        sessionStorage.removeItem("resetEmail");

        setTimeout(() => {

            window.location.href =
                "index.html";

        }, 1500);

    } catch (error) {

        console.error(
            "❌ Reset Password Error:",
            error
        );

        message.className = "error";

        message.textContent =
            error.message ||
            "Unable to reset password.";
    }

});

</script>

</body>
</html>
