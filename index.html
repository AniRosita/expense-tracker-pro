<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker Pro</title>

    <!-- FAVICON -->
    <link
        rel="icon"
        type="image/png"
        href="assets/profile.png"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- GOOGLE FONT -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- FONT AWESOME -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

</head>


<body>

    <!-- BACKGROUND -->
    <div class="background">

        <div class="glow glow1"></div>

        <div class="glow glow2"></div>

    </div>


    <!-- LOGIN CONTAINER -->
    <div class="login-container">

        <div class="login-card">

            <!-- LOGO -->
            <div class="logo">

                <i class="fas fa-wallet"></i>

            </div>


            <!-- TITLE -->
            <h1>
                Expense Tracker Pro
            </h1>

            <p>
                Track Expenses Smartly
            </p>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- EMAIL -->
                <div class="input-box">

                    <i class="fas fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter Gmail Address"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="input-box">

                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter 6 Digit Password"
                        maxlength="6"
                        minlength="6"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- FORGOT PASSWORD -->
                <div class="forgot-password">

                    <a
                        href="#"
                        id="forgotPasswordLink"
                    >
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    id="loginBtn"
                >

                    <i class="fas fa-right-to-bracket"></i>

                    Login

                </button>

            </form>


            <!-- MESSAGE -->
            <div id="message"></div>


            <!-- LOGIN INFO -->
            <div class="login-info">

                <small>

                    Gmail only accepted
                    <br>

                    Password must contain exactly 6 digits

                </small>

            </div>


            <!-- REGISTER -->
            <p
                style="
                    margin-top:15px;
                    text-align:center;
                "
            >

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <!-- TOAST -->
    <script src="js/toast.js"></script>


    <!-- SWEETALERT -->
    <script
        src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>


    <!-- ONLY AUTH SCRIPT -->
    <script src="js/auth.js"></script>

</body>

</html>
